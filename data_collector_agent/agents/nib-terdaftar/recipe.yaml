version: 1.0.0
title: Jumlah NIB Terdaftar
description: Meneliti jumlah terbaru Nomor Induk Berusaha yang terdaftar hingga akhir 2026 dan menyimpan hasil beserta sumbernya.
instructions: |
  Baca dan ikuti agents/nib-terdaftar/instruction.md. Gunakan alat pencarian web
  yang tersedia untuk memeriksa sumber secara langsung. Simpan jumlah terverifikasi
  langsung ke tabel database yang ditentukan dalam instruksi menggunakan
  tools/database.py. Jangan membuat file hasil JSON. Jangan mengarang data atau sumber.
prompt: |
  Cari jumlah NIB terdaftar terbaru dengan tanggal data tidak melewati 31 Desember
  2026, lalu masukkan jumlah dan sumber terverifikasi ke database sesuai instruksi.
extensions:
  - type: builtin
    name: developer
    display_name: Developer
    timeout: 300
    bundled: true
